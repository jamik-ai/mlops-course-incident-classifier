# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint & Build
permissions:
  contents: read
  packages: write
on:
  pull_request:
    branches: [ main ]   # запуск при MR в main
  push:
    branches: [ main ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ESLint
        run: npm install -g eslint@8
      - name: Run ESLint
        run: eslint ./src/api/frontend --ext .js,.jsx,.mjs,.cjs

  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run pytest
        run: pytest tests/

  build:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-js, test]   # билдим только если линтеры прошли
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mlops-course-incident-classifier:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mlops-course-incident-classifier-frontend:latest
      - name: Build and push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mlflow
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mlops-course-incident-classifier-mlflow:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "No KUBE_CONFIG_DATA secret set. Skipping deploy."
            exit 0
          fi
          echo "$KUBE_CONFIG_DATA" | base64 --decode > kubeconfig
        shell: bash
      - name: Deploy to Kubernetes
        run: |
          if [ ! -s kubeconfig ]; then
            echo "kubeconfig is empty. Skipping deploy."
            exit 0
          fi
          export KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig
          kubectl apply -f k8s/ --recursive --validate=false
          kubectl rollout restart deployment/call-forecast-backend -n mlops
          kubectl rollout restart deployment/call-forecast-frontend -n mlops
          kubectl rollout restart deployment/mlflow -n mlops
        shell: bash
