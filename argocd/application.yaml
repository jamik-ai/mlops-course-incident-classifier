apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: call-forecast
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jamik-ai/mlops-course-incident-classifier.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
