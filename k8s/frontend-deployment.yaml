apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-forecast-frontend
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: call-forecast-frontend
  template:
    metadata:
      labels:
        app: call-forecast-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jamik-ai/mlops-course-incident-classifier-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
