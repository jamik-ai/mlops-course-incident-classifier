apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/test-org/mlops-course-incident-classifier-mlflow:latest
          command: ["/bin/sh", "-c"]
          args: ["mlflow server --backend-store-uri \"$MLFLOW_BACKEND_STORE_URI\" --default-artifact-root \"$MLFLOW_DEFAULT_ARTIFACT_ROOT\" --host 0.0.0.0 --port 5000"]
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              value: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
            - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
              value: s3://mlflow
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-s3-credentials
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-s3-credentials
                  key: secretkey
            - name: AWS_ENDPOINT_URL
              value: http://minio:9000
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
