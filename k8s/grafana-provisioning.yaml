apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        overwrite: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
  dashboard.json: |
    {
      "id": null,
      "uid": "backend-metrics",
      "title": "Backend Metrics",
      "tags": ["backend"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[5m])) by (method, status_code)",
              "legendFormat": "{{method}} {{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" } }
          }
        },
        {
          "id": 2,
          "title": "Request Duration (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, method))",
              "legendFormat": "p95 {{method}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Active Requests",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(http_request_duration_seconds_count)",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 4,
          "title": "Python Info",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "python_info",
              "legendFormat": "Python {{major}}.{{minor}}"
            }
          ]
        }
      ]
    }
  mlops-drift.json: |
    {
      "id": null,
      "uid": "mlops-drift",
      "title": "MLOps Drift Monitoring",
      "tags": ["mlops", "drift"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Data Drift Share",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_data_drift_share"}]
        },
        {
          "id": 2, "type": "stat", "title": "Data Drift Detected",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_data_drift_detected"}]
        },
        {
          "id": 3, "type": "stat", "title": "Target Drift Detected",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_target_drift_detected"}]
        },
        {
          "id": 4, "type": "stat", "title": "Concept Drift Detected",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_concept_drift_detected"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Feature PSI",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_feature_psi", "legendFormat": "{{feature}}"}]
        },
        {
          "id": 6, "type": "timeseries", "title": "Feature KS p-value",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_feature_ks_pvalue", "legendFormat": "{{feature}}"}]
        },
        {
          "id": 7, "type": "timeseries", "title": "Feature JS Distance",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_feature_js_distance", "legendFormat": "{{feature}}"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Model MAE",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "ml_model_mae"}]
        }
      ]
    }