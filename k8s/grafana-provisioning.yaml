apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        overwrite: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
  dashboard.json: |
    {
      "id": null,
      "uid": "backend-metrics",
      "title": "Backend Metrics",
      "tags": ["backend"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[5m])) by (method, status_code)",
              "legendFormat": "{{method}} {{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" } }
          }
        },
        {
          "id": 2,
          "title": "Request Duration (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, method))",
              "legendFormat": "p95 {{method}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Active Requests",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(http_request_duration_seconds_count)",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 4,
          "title": "Python Info",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "python_info",
              "legendFormat": "Python {{major}}.{{minor}}"
            }
          ]
        }
      ]
    }