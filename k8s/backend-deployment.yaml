apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-forecast-backend
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: call-forecast-backend
  template:
    metadata:
      labels:
        app: call-forecast-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: ghcr.io/test-org/mlops-course-incident-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_MODEL_NAME
              value: call-volume-forecast
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
