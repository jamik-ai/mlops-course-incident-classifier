services:
  backend:
    build: .
    container_name: call_forecast_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=call-volume-forecast
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      - mlflow
    networks:
      - forecast_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: call_forecast_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - forecast_network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: call_forecast_mlflow
    ports:
      - "5001:5000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
    depends_on:
      - postgres
      - minio
    volumes:
      - mlflow-artifacts:/tmp/mlflow/artifacts
    networks:
      - forecast_network

  postgres:
    image: postgres:15
    container_name: call_forecast_postgres
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - forecast_network

  minio:
    image: minio/minio:latest
    container_name: call_forecast_minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - forecast_network

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: call_forecast_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - forecast_network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: call_forecast_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - forecast_network

volumes:
  grafana-storage:
  mlflow-artifacts:
  postgres-data:
  minio-data:

networks:
  forecast_network:
    driver: bridge
